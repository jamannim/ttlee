<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00704A" />
      <stop offset="100%" stop-color="#142C24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C499" />
      <stop offset="100%" stop-color="#B69B7D" />
    </linearGradient>
  </defs>

  <!-- 1. 둥근 스퀘어 배경 프레임 (캔버스에 꽉 차는 풀블리드) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" />

  <!-- 2. 골드 보더 링 -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- 3. 대형 미디어 재생 심볼 (▶ - 굵고 선명하게 중앙 배치) -->
  <path d="M 24 18 L 47 32 L 24 46 Z" fill="#FFFFFF" />

  <!-- 4. 골드 스파클 심볼 (우상단) -->
  <circle cx="47" cy="17" r="4.8" fill="url(#goldGrad)" />
</svg>