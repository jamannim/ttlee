<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brandA_symbolGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00704A" />
      <stop offset="100%" stop-color="#142C26" />
    </linearGradient>
    <linearGradient id="brandA_goldGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9BF9E" />
      <stop offset="100%" stop-color="#B69B7D" />
    </linearGradient>
  </defs>

  <!-- 1. 심볼 엠블럼: 프리미엄 미디어 프레임 & 스파클 재생 아이콘 -->
  <g transform="translate(6, 6)">
    <!-- 둥근 스퀘어 배경 프레임 -->
    <rect x="0" y="0" width="52" height="52" rx="16" fill="url(#brandA_symbolGrad_dark)" stroke="#8DE0BD" stroke-width="1.2" stroke-opacity="0.3" />
    
    <!-- 섬세한 골드 보더 링 -->
    <rect x="2" y="2" width="48" height="48" rx="14" fill="none" stroke="#B69B7D" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- 미디어 재생 심볼 (▶) -->
    <path d="M 22 17 L 35 26 L 22 35 Z" fill="#FFFFFF" />
    
    <!-- 발견과 가치 창출을 상징하는 골드 스파클 -->
    <circle cx="36" cy="16" r="3.2" fill="url(#brandA_goldGrad_dark)" />
  </g>

  <!-- 2. 워드마크: 화이트 & 골드 -->
  <text x="72" y="35" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">뜰레</text>
  <text x="124" y="34" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="700" fill="#D9BF9E" letter-spacing="0.08em">TTLEE</text>
  
  <!-- 서브 브랜드 카테고리 'MEDIA COMMERCE' -->
  <text x="73" y="51" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#8DE0BD" letter-spacing="0.22em">MEDIA COMMERCE</text>
</svg>
